server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The hub is one page: any path it does not recognise is the app itself, so a
  # reload on /control-room or /messenger lands on the app rather than a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Built files carry a hash in their name, so they can be cached for a while.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # The service worker must never be cached, or an update would never arrive.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
}
