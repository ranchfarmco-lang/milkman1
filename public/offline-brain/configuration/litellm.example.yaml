# Route several local models behind one OpenAI-compatible endpoint.
#   litellm --config configuration/litellm.example.yaml --port 4000
# Then point agents at http://localhost:4000 with model names like
# "coder", "reasoner", "vision".
model_list:
  - model_name: coder
    litellm_params:
      model: openai/qwen2.5-coder-32b
      api_base: http://localhost:8000/v1
      api_key: local
  - model_name: agentic-coder
    litellm_params:
      model: openai/qwen3-coder-30b-a3b
      api_base: http://localhost:8000/v1
      api_key: local
  - model_name: reasoner
    litellm_params:
      model: openai/deepseek-r1-distill-qwen-32b
      api_base: http://localhost:8001/v1
      api_key: local
  - model_name: vision
    litellm_params:
      model: openai/qwen2.5-vl-7b-instruct
      api_base: http://localhost:8002/v1
      api_key: local
  - model_name: embeddings
    litellm_params:
      model: openai/bge-m3
      api_base: http://localhost:8080/v1
      api_key: local

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2

general_settings:
  master_key: local
